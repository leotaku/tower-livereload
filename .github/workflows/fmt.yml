name: fmt

on:
  pull_request:
  push:
    tags:
    branches:
      - master

permissions: {}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable
      - run: cargo fmt --check
