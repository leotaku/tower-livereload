[package]
name = "axum-idiomorph"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
notify = "8.2.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tower-livereload = { path = "../.." }
